# Application Configuration
spring.application.name=procureai

# Server
server.port=8080
server.servlet.context-path=/api

# Database (PostgreSQL for production, H2 for demo/test)
spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:procureai;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driver-class-name=${DATABASE_DRIVER:org.h2.Driver}
spring.datasource.username=${DATABASE_USER:sa}
spring.datasource.password=${DATABASE_PASSWORD:}

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Security
spring.security.oauth2.resourceserver.jwt.issuer-uri=${JWT_ISSUER_URI:}
procureai.jwt.secret=${JWT_SECRET:procureai-secret-key-change-in-production-min-256-bits}
procureai.jwt.expiration=86400000
procureai.jwt.refresh-expiration=604800000

# AI Configuration
procureai.ai.provider=${AI_PROVIDER:mock}
procureai.ai.openai.api-key=${OPENAI_API_KEY:}
procureai.ai.openai.model=${OPENAI_MODEL:gpt-4o}
procureai.ai.openai.temperature=0.1
procureai.ai.openai.max-tokens=4000
procureai.ai.azure.endpoint=${AZURE_OPENAI_ENDPOINT:}
procureai.ai.azure.api-key=${AZURE_OPENAI_API_KEY:}
procureai.ai.azure.deployment=${AZURE_OPENAI_DEPLOYMENT:}

# Document Processing
procureai.document.max-file-size=10MB
procureai.document.allowed-types=application/pdf,image/png,image/jpeg,image/tiff,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document
procureai.document.ocr.enabled=true
procureai.document.ocr.language=eng

# Email
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
procureai.email.from=${MAIL_FROM:noreply@procureai.com}

# Demo Mode
procureai.demo.enabled=${DEMO_MODE:true}
procureai.demo.seed-data=true

# File Storage
procureai.storage.type=${STORAGE_TYPE:local}
procureai.storage.local.path=./uploads
procureai.storage.s3.bucket=${S3_BUCKET:}
procureai.storage.s3.region=${S3_REGION:us-east-1}

# Procurement Rules (Configurable)
procureai.procurement.target-price-threshold=0.15
procureai.procurement.max-negotiation-rounds=3
procureai.procurement.default-strategy=BALANCED

# Logging
logging.level.com.procureai=DEBUG
logging.level.org.springframework.security=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n