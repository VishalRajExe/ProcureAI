# Production Profile
spring.config.activate.on-profile=prod

spring.datasource.url=${PROD_DATABASE_URL:jdbc:postgresql://localhost:5432/procureai}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${PROD_DATABASE_USER:postgres}
spring.datasource.password=${PROD_DATABASE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

procureai.ai.provider=${PROD_AI_PROVIDER:azure}
procureai.demo.enabled=false

logging.level.com.procureai=INFO
logging.level.org.springframework.security=WARN