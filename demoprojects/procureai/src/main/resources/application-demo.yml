# Demo Profile - Uses H2 in-memory database and Mock AI
spring.config.activate.on-profile=demo

spring.datasource.url=jdbc:h2:mem:procureai;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

procureai.ai.provider=mock
procureai.demo.enabled=true
procureai.demo.seed-data=true

logging.level.com.procureai=DEBUG