# Development Profile - PostgreSQL with real AI
spring.config.activate.on-profile=dev

spring.datasource.url=${DEV_DATABASE_URL:jdbc:postgresql://localhost:5432/procureai_dev}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DEV_DATABASE_USER:postgres}
spring.datasource.password=${DEV_DATABASE_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

procureai.ai.provider=${DEV_AI_PROVIDER:openai}
procureai.demo.enabled=false

logging.level.com.procureai=DEBUG