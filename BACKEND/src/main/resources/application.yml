spring:
  application:
    name: procureai-backend

  profiles:
    active: demo   # demo = H2 in-memory (zero setup). Switch to 'mysql' when DB is ready.

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false   # Never log SQL in production — could expose query structure
    open-in-view: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
    include-exception: false

app:
  jwt:
    secret: ${JWT_SECRET:CHANGE_ME_this_is_a_dev_only_secret_replace_before_any_real_deployment}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

  ai:
    # Gemini AI configuration — reads from GEMINI_API_KEY or AI_API_KEY environment variable
    provider: ${AI_PROVIDER:${GEMINI_PROVIDER:gemini}}     # mock | gemini
    model: ${GEMINI_MODEL:gemini-1.5-flash}
    api-key: ${GEMINI_API_KEY:${AI_API_KEY:}}

  email:
    # Brevo Email configuration — reads from BREVO_API_KEY environment variable
    provider: ${EMAIL_PROVIDER:${BREVO_PROVIDER:brevo}}  # mock | brevo
    api-key: ${BREVO_API_KEY:}
    sender-email: ${BREVO_SENDER_EMAIL:procurement@procureai.demo}
    sender-name: ${BREVO_SENDER_NAME:ProcureAI}

  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

  po:
    output-dir: ${PO_OUTPUT_DIR:./po-output}

logging:
  level:
    com.procureai: INFO
    org.hibernate.SQL: WARN
    org.springframework.security: WARN

---
spring:
  config:
    activate:
      on-profile: demo
  datasource:
    url: jdbc:h2:mem:procureai;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect

---
spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/procureai?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:admin}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
  h2:
    console:
      enabled: false
  jpa:
    database-platform: org.hibernate.dialect.MySQL8Dialect
    hibernate:
      ddl-auto: update
