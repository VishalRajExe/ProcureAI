spring:
  application:
    name: procureai-backend

  profiles:
    active: demo   # demo = H2 in-memory (zero setup). Switch to 'mysql' when DB is ready.

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    # NOTE: left at Spring Boot's default (true) for this hackathon build so lazy
    # associations (Quote.vendor, Negotiation.quote, etc.) can serialize safely from
    # simple non-transactional read methods. For a production build, switch to false
    # and add @EntityGraph/DTO projections everywhere entities cross the API boundary.
    open-in-view: true

  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 20MB

server:
  port: 8080
  error:
    include-message: always
    include-stacktrace: never

app:
  jwt:
    secret: ${JWT_SECRET:change_this_dev_only_secret_key_min_32_chars_long_please}
    expiration-ms: 86400000
  ai:
    provider: ${AI_PROVIDER:mock}     # mock | openai | anthropic
    api-key: ${AI_API_KEY:}
  email:
    provider: ${EMAIL_PROVIDER:mock}  # mock | smtp
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

logging:
  level:
    com.procureai: INFO

---
spring:
  config:
    activate:
      on-profile: demo
  datasource:
    url: jdbc:h2:mem:procureai;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect

---
spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/procureai?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:admin}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    database-platform: org.hibernate.dialect.MySQL8Dialect
