spring:
  application:
    name: procureai-backend

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:demo}   # demo = H2 in-memory (zero setup). Switch to 'mysql' or 'prod' when DB is ready.

  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        format_sql: false   # Never log SQL in production — could expose query structure
    open-in-view: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

  jackson:
    serialization:
      FAIL_ON_EMPTY_BEANS: false

server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
    include-exception: false

app:
  jwt:
    secret: ${JWT_SECRET:CHANGE_ME_this_is_a_dev_only_secret_replace_before_any_real_deployment}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

  ai:
    # Gemini AI configuration — reads from GEMINI_API_KEY or AI_API_KEY environment variable
    provider: ${AI_PROVIDER:${GEMINI_PROVIDER:gemini}}     # mock | gemini
    model: ${GEMINI_MODEL:gemini-1.5-flash-latest}
    api-key: ${GEMINI_API_KEY:${AI_API_KEY:}}

  email:
    # Brevo Email configuration — reads from BREVO_API_KEY environment variable
    provider: ${EMAIL_PROVIDER:${BREVO_PROVIDER:brevo}}  # mock | brevo
    api-key: ${BREVO_API_KEY:${APP_EMAIL_API_KEY:}}
    sender-email: ${BREVO_SENDER_EMAIL:vishalrajbca15@gmail.com}
    smtp-username: ${BREVO_SMTP_USERNAME:b4d3dd001@smtp-brevo.com}
    sender-name: ${BREVO_SENDER_NAME:ProcureAI}

  cors:
    allowed-origins: ${CORS_ORIGINS:${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,https://procure-ai.web.app,https://procure-ai.firebaseapp.com,https://procureai-89869.web.app,https://procureai-89869.firebaseapp.com}}

  po:
    output-dir: ${PO_OUTPUT_DIR:./po-output}

  python-ai:
    # FastAPI AI/ML Service — opt-in (default: disabled for safe local dev)
    # Set PYTHON_AI_ENABLED=true and start: cd AI-SERVICE && uvicorn main:app --reload
    enabled: ${PYTHON_AI_ENABLED:false}
    base-url: ${PYTHON_AI_URL:http://localhost:8000}
    connect-timeout-ms: ${PYTHON_AI_CONNECT_TIMEOUT:5000}
    read-timeout-ms: ${PYTHON_AI_READ_TIMEOUT:60000}
    # Optional: shared secret for Spring Boot → FastAPI auth (set same in AI-SERVICE/.env)
    internal-token: ${PYTHON_AI_INTERNAL_TOKEN:}
    # Startup health check — max attempts before logging UNAVAILABLE (non-blocking)
    startup-check-attempts: ${PYTHON_AI_STARTUP_ATTEMPTS:3}

logging:
  level:
    com.procureai: INFO
    org.hibernate.SQL: WARN
    org.springframework.security: WARN
    org.springframework.mail: DEBUG

---
spring:
  config:
    activate:
      on-profile: demo
  datasource:
    url: jdbc:h2:mem:procureai;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect

---
spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/procureai?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:admin}
    driver-class-name: ${DB_DRIVER:com.mysql.cj.jdbc.Driver}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
  h2:
    console:
      enabled: false
  jpa:
    database-platform: ${DB_DIALECT:org.hibernate.dialect.MySQL8Dialect}
    hibernate:
      ddl-auto: ${DDL_AUTO:update}

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/procureai?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:admin}
    driver-class-name: ${DB_DRIVER:com.mysql.cj.jdbc.Driver}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  h2:
    console:
      enabled: false
  jpa:
    database-platform: ${DB_DIALECT:org.hibernate.dialect.MySQL8Dialect}
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
